name: AuctionHousePro
version: '${project.version}'
main: com.auctionhousepro.AuctionHouseProPlugin
api-version: '1.20.6'
authors: [Erissos]
description: Premium auction house for Paper 1.20.6 through 26.2
softdepend: [Vault, PlaceholderAPI]
commands:
  auctionhouse:
    aliases: [ah, auc]
    description: Opens and manages the auction house
    usage: /<command> [menu|help|language <code>|reload|subcommand]
permissions:
  auctionhousepro.use:
    default: true
  auctionhousepro.admin:
    default: op
  auctionhousepro.bypass.fees:
    default: op
  auctionhousepro.locale:
    default: true
  auctionhousepro.reload:
    default: op
